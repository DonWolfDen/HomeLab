services:
  tdarr:
    # Attributes
    image: ghcr.io/haveagitgat/tdarr
    container_name: tdarr
    restart: always
    pull_policy: always
    # Network
    network_mode: bridge
    ports:
      - 8265:8265 # webUI port
      - 8266:8266 # server port
    # Resources
    volumes:
      - tdarr_server:/app/server
      - tdarr_configs:/app/configs
      - tdarr_logs:/app/logs
      - /mnt/plex:/media
      - /mnt/tdarr/cache:/temp
    # Variables
    environment:
      - TZ=America/Detroit
      - PUID=1000
      - PGID=1000
      - UMASK_SET=002
      - serverIP=${SERVER_IP:?Missing SERVER_IP in .env file!}
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=6
      - nodeName=${HOSTNAME}

volumes:
  tdarr_server:
    driver: local
  tdarr_configs:
    driver: local
  tdarr_logs:
    driver: local

# ==========================================
# ENVIRONMENT VARIABLES
# ==========================================
# SERVER_IP
