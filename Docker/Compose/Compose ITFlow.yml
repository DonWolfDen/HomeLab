services:
  itflow:
    # Attributes
    image: itfloworg/itflow:latest
    container_name: itflow
    platform: linux/amd64
    restart: always
    pull_policy: always
    depends_on: 
      - itflow-db
    # Network
    hostname: itflow
    networks:
      - wan
      - itflow-db
    ports:
      - 8081:8080
    # Resources
    volumes:
      - itflow:/var/www/localhost/htdocs
    # Variables
    environment:
      - TZ=America/Detroit
      - ITFLOW_NAME=ITFlow
      - ITFLOW_PORT=8080
      - ITFLOW_REPO=github.com/itflow-org/itflow
      - ITFLOW_REPO_BRANCH=master
      - ITFLOW_LOG_LEVEL=info
      - ITFLOW_DB_HOST=itflow-db
      - ITFLOW_DB_PASS=${DB_PASS:?Missing DB_PASS in .env file!}
      - ITFLOW_URL=https://${ITFLOW_URL:?Missing ITFLOW_URL in .env file!} # add :8081 to variable if using local IP

  itflow-db:
    # Attributes
    image: mariadb:10.11.6
    container_name: itflow-db
    restart: always
    pull_policy: always
    # Network
    hostname: itflow-db
    networks:
      - itflow-db
    # Resources
    volumes:
      - itflow-db:/var/lib/mysql/
    # Variables
    env_file:
      - stack.env
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=true
      - MARIADB_DATABASE=${DB_NAME:-itflow}
      - MARIADB_USER=${DB_USER:-itflow}
      - MARIADB_PASSWORD=${DB_PASS:?Missing DB_PASS in .env file!}

networks:
  wan:
    name: wan
    driver: bridge
  itflow-db:
    name: itflow-db
    external: false

volumes:
  itflow:
    driver: local
  itflow-db:
    driver: local

# ==========================================
# ENVIRONMENT VARIABLES
# ==========================================
# DB_PASS
# ITFLOW_URL
