services:
  portainer:
    # Attributes
    image: portainer/agent:2.39.5
    container_name: portainer_agent
    restart: always
    pull_policy: always
    # Network
    ports:
      - 9001:9001
    # Resources
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    # Variables
    environment:
      - TZ=America/Detroit
