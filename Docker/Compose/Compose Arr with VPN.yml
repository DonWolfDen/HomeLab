# ==========================================
# REUSABLE VARIABLES
# ==========================================
x-variables: 
  default_policy: &default_policy
    restart: always
    pull_policy: always
  vpn-routed: &vpn-routed
    <<: *default_policy
    depends_on:
     - gluetun
    network_mode: service:gluetun
  arr-env: &arr-env
    PUID: 1000
    PGID: 1000
    TZ: &tz "America/Detroit"
  volume-paths:
    downloads: &vol-downloads "/mnt/plex/Downloads:/downloads"
    plex-media: &vol-plex "/mnt/plex:/plex"
# ==========================================
# SERVICES
# ==========================================
services:
  gluetun:
    <<: *default_policy
    image: qmcgaw/gluetun
    container_name: gluetun
    ports:
      - 6881:6881 # qbittorrent
      - 6881:6881/udp # qbittorrent
      - 8085:8085 # qbittorrent
      - 9696:9696 # Prowlarr
      - 8989:8989 # Sonarr
      - 7878:7878 # Radarr
      - 8686:8686 # Lidarr
      - 8191:8191 # FlareSolverr
    volumes:
      - gluetun:/gluetun
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: *tz
      VPN_SERVICE_PROVIDER: protonvpn
      SERVER_COUNTRIES: United States
      UPDATER_PERIOD: 24h
      OPENVPN_USER: ${OPENVPN_USER:?Missing OPENVPN_USER in .env file!} # Find this at account.proton.me/u/0/vpn/OpenVpnIKEv2
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:?Missing OPENVPN_PASSWORD in .env file!} # Find this at account.proton.me/u/0/vpn/OpenVpnIKEv2
#      VPN_PORT_FORWARDING=on #optional
    cap_add:
      - NET_ADMIN

  qbittorrent:
    <<: *vpn-routed
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    volumes:
      - qbittorrent:/config
      - *vol-downloads
    environment:
      <<: *arr-env
      WEBUI_PORT: 8085

  sonarr:
    <<: *vpn-routed
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - sonarr:/config
      - *vol-downloads
      - *vol-plex
    environment:
      <<: *arr-env

  radarr:
    <<: *vpn-routed
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - radarr:/config
      - *vol-downloads
      - *vol-plex
    environment:
      <<: *arr-env

  lidarr:
    <<: *vpn-routed
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    volumes:
      - lidarr:/config
      - *vol-downloads
      - *vol-plex
    environment:
      <<: *arr-env

  bazarr:
    <<: *vpn-routed
    image: lscr.io/linuxserver/bazarr
    container_name: bazarr
    volumes:
      - bazarr:/config
      - *vol-plex
    environment:
      <<: *arr-env

  prowlarr:
    <<: *vpn-routed
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - prowlarr:/config
    environment:
      <<: *arr-env

  flaresolverr:
    <<: *vpn-routed
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: *tz

  overseerr:
    <<: *default_policy
    image: sctx/overseerr:latest
    container_name: overseerr
    ports:
      - 5055:5055
    volumes:
      - overseerr:/app/config
    environment:
      LOG_LEVEL: debug
      TZ: *tz

volumes:
  gluetun:
    driver: local
  qbittorrent:
    driver: local
  sonarr:
    driver: local
  radarr:
    driver: local
  lidarr:
    driver: local
  prowlarr:
    driver: local
  overseerr:
    driver: local
  bazarr:
    driver: local

# ==========================================
# ENVIRONMENT VARIABLES
# ==========================================
# OPENVPN_USER
# OPENVPN_PASSWORD
