services:
  tunnel:
    # Attributes
    image: cloudflare/cloudflared
    container_name: cloudflared-tunnel
    restart: always
    pull_policy: always
    # Variables
    env_file:
      - stack.env
    environment:
      - TZ=America/Detroit
#      - TUNNEL_TOKEN= # mytokenfromcloudflare-com
    # Interaction
    command: tunnel run
